{
  "name": "Deye daily private collection",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "recommendation_dry_run": {
          "description": "Test recommendation using existing private data without saving or connecting to Deye",
          "type": "boolean",
          "default": false
        }
      }
    }
  },
  "permissions": {},
  "concurrency": {"group": "deye-private-daily", "cancel-in-progress": false},
  "jobs": {
    "collect": {
      "if": "${{ vars.DEYE_AUTOMATION_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "environment": "deye-production",
      "permissions": {"contents": "read"},
      "steps": [
        {
          "name": "Checkout public code only",
          "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd",
          "with": {"persist-credentials": false, "fetch-depth": 0}
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548",
          "with": {"python-version": "3.12"}
        },
        {"name": "Install collector dependencies", "run": "python -m pip install --disable-pip-version-check -r requirements-actions.txt"},
        {"name": "Check public tree and Git history", "run": "python -B scripts/check_publication.py"},
        {"name": "Run offline collector tests", "run": "python -B -m unittest discover -s tests -p test_daily_collection.py -q"},
        {
          "name": "Run offline recommendation tests",
          "if": "${{ vars.DEYE_RECOMMENDATION_ENABLED == 'true' || inputs.recommendation_dry_run }}",
          "run": "python -B -m unittest discover -s tests -p test_recommend_deye.py -q"
        },
        {
          "name": "Create private-repository installation token",
          "if": "${{ vars.DEYE_DATA_AUTH_MODE != 'pat' }}",
          "id": "app-token",
          "uses": "actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf",
          "with": {
            "app-id": "${{ secrets.DEYE_DATA_APP_ID }}",
            "private-key": "${{ secrets.DEYE_DATA_APP_PRIVATE_KEY }}",
            "owner": "${{ vars.DEYE_DATA_OWNER || github.repository_owner }}",
            "repositories": "DeyeCloud-data",
            "permission-contents": "${{ inputs.recommendation_dry_run && 'read' || 'write' }}",
            "skip-token-revoke": false
          }
        },
        {
          "name": "Collect and atomically update private data",
          "if": "${{ !inputs.recommendation_dry_run }}",
          "run": "python -B scripts/collect_deye_daily.py",
          "env": {
            "DEYE_AUTOMATION_ENABLED": "${{ vars.DEYE_AUTOMATION_ENABLED }}",
            "DEYE_AUTH_MODE": "environment",
            "DEYE_APP_ID": "${{ secrets.DEYE_APP_ID }}",
            "DEYE_APP_SECRET": "${{ secrets.DEYE_APP_SECRET }}",
            "DEYE_EMAIL": "${{ secrets.DEYE_EMAIL }}",
            "DEYE_PASSWORD": "${{ secrets.DEYE_PASSWORD }}",
            "DEYE_DATA_REPOSITORY": "${{ vars.DEYE_DATA_OWNER || github.repository_owner }}/DeyeCloud-data",
            "DEYE_DATA_TOKEN": "${{ vars.DEYE_DATA_AUTH_MODE == 'pat' && secrets.DEYE_DATA_TOKEN || steps.app-token.outputs.token }}",
            "DEYE_COLLECTION_MODE": "combined"
          }
        },
        {
          "name": "Forecast and record a read-only recommendation",
          "if": "${{ vars.DEYE_RECOMMENDATION_ENABLED == 'true' || inputs.recommendation_dry_run }}",
          "timeout-minutes": 3,
          "run": "python -B scripts/recommend_deye.py",
          "env": {
            "DEYE_RECOMMENDATION_ENABLED": "${{ vars.DEYE_RECOMMENDATION_ENABLED }}",
            "DEYE_RECOMMENDATION_DRY_RUN": "${{ inputs.recommendation_dry_run }}",
            "DEYE_APPROVAL_ENABLED": "${{ vars.DEYE_APPROVAL_ENABLED }}",
            "DEYE_APPROVER_IDS": "${{ vars.DEYE_APPROVER_IDS }}",
            "DEYE_APPROVER_LOGINS": "${{ vars.DEYE_APPROVER_LOGINS }}",
            "DEYE_APPROVAL_CUTOFF": "${{ vars.DEYE_APPROVAL_CUTOFF }}",
            "DEYE_APPROVAL_WORKFLOW_TOKEN": "${{ vars.DEYE_APPROVAL_ENABLED == 'true' && !inputs.recommendation_dry_run && secrets.DEYE_APPROVAL_WORKFLOW_TOKEN || '' }}",
            "DEYE_DATA_REPOSITORY": "${{ vars.DEYE_DATA_OWNER || github.repository_owner }}/DeyeCloud-data",
            "DEYE_DATA_TOKEN": "${{ vars.DEYE_DATA_AUTH_MODE == 'pat' && secrets.DEYE_DATA_TOKEN || steps.app-token.outputs.token }}"
          }
        }
      ]
    }
  }
}
